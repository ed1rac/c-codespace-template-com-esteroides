name: C Template Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  c-validation:
    name: Test C Compilers (GCC & Clang)
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar Repositório
      uses: actions/checkout@v4

    - name: 🔧 Instalar Compiladores e Utilitários C
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc clang valgrind make

    - name: 🧪 Testar Compilação com GCC
      run: |
        echo '#include <stdio.h>' > test.c
        echo 'int main(void) { printf("Template C funcionando!\n"); return 0; }' >> test.c
        gcc -Wall -Wextra -Werror -std=c11 test.c -o test_gcc
        ./test_gcc

    - name: 🧪 Testar Compilação com Clang
      run: |
        clang -Wall -Wextra -Werror -std=c11 test.c -o test_clang
        ./test_clang
